name: Regenerate Playground

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          # ppx_import (1.12.0) requires OCaml < 5.5, so do not use the
          # newest 5.x release.
          ocaml-compiler: "5.4"
      - run: opam install . --deps-only
      - run: opam exec -- dune build --profile=release
      - name: Save built file
        run: cp _build/default/js/dwarf_evaluator.html /tmp/dwarf_evaluator.html
      - name: Upload built file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwarf_evaluator.html
          path: /tmp/dwarf_evaluator.html
      - name: Checkout playground branch
        uses: actions/checkout@v5
        with:
          ref: playground
          path: playground
      - name: Update index.html
        run: cp /tmp/dwarf_evaluator.html playground/index.html
      - name: Commit and push
        working-directory: playground
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "regenerate playground"
          git push --force origin "HEAD:refs/heads/regenerate-playground"
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: playground
        run: |
          gh pr create \
            --base playground \
            --head regenerate-playground \
            --title "regenerate playground" \
            --body 'Automatically generated by the "Regenerate Playground" workflow.' \
            || echo "A pull request for this branch likely already exists; skipping creation."
